<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <button onclick="document.getElementById('para').innerText = 'Total qnt: ' + cartquantity">
        Show Quantity
    </button>
    <button onclick="console.log(cartquantity = cartquantity + 1)">Add to Cart</button>
    <button onclick="console.log(cartquantity = cartquantity + 2)">+2</button>
    <button onclick="console.log(cartquantity = cartquantity + 3)">+3</button>
    <button onclick="console.log(cartquantity = 0)">Reset</button>
    <p id="para">0</p>
    <script>
        let cartquantity = 0;
        document.getElementById('para').innerText = cartquantity;
    </script>
</body>
</html>
